[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypodlib"
version = "0.1.0"
description = "Communicate with iPod Classic/Nano/Mini devices — detect and identify the device, read and write the iTunesDB library, and sync media — without iTunes."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "La22e"},
]
keywords = [
    "ipod", "ipod-classic", "itunes", "itunesdb", "music-sync",
    "ipod-manager", "music-library", "ipod-sync", "itunes-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "pyusb>=1.3.1",
    "libusb-package>=1.0.30.0",
    "pycryptodome>=3.20.0",
    "wasmtime>=30.0.0",
]

[project.optional-dependencies]
artwork = [
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "mutagen>=1.47.0",
]

[project.urls]
Homepage = "https://la22e.github.io/pyPodLib/"
Repository = "https://github.com/La22e/pyPodLib"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "ruff>=0.11.7",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.28",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pypodlib"]
include = [
    "/src/pypodlib/**/*.py",
    "/src/pypodlib/itunesdb_writer/wasm/calcHashAB.wasm",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 320
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]