site_name: pyPodLib
site_description: Read, write, and sync iPod Classic/Nano/Mini libraries from Python — no iTunes required.
repo_url: https://github.com/La22e/pyPodLib
repo_name: pyPodLib
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_api_pages.py
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            members_order: source
            group_by_category: true
            filters:
              - "!^_"
              - "!__class__"

watch:
  - src/pypodlib

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - User Guide:
      - usage/read-write.md
      - usage/sync-media.md
      - usage/backup-restore.md
      - usage/virtual-ipods.md
  - Reference:
      - pypodlib: reference/pypodlib/index.md
      - API: reference/pypodlib/api.md
      - Device: reference/pypodlib/device.md
      - iTunesDB parser: reference/pypodlib/itunesdb_parser.md
      - iTunesDB writer: reference/pypodlib/itunesdb_writer.md
      - iTunesDB shared: reference/pypodlib/itunesdb_shared.md
      - ArtworkDB parser: reference/pypodlib/artworkdb_parser.md
      - ArtworkDB writer: reference/pypodlib/artworkdb_writer.md
      - ArtworkDB shared: reference/pypodlib/artworkdb_shared.md
      - SQLite writer: reference/pypodlib/sqlitedb_writer.md
      - Sync: reference/pypodlib/sync.md
      - Device matrix: reference/device-matrix.md
  - Limitations: limitations.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - toc:
      permalink: true
